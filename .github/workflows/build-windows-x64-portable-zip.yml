name: Build Windows x64 Portable Zip

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portable-zip:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build 7-Zip binaries
        shell: cmd
        run: |
          cd CPP\7zip
          nmake PLATFORM=x64

      - name: Prepare portable package
        shell: powershell
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE 'dist\7zip-windows-x64-portable'
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'dist\7zip-windows-x64-portable.zip'

          if (Test-Path $packageRoot) {
            Remove-Item -LiteralPath $packageRoot -Recurse -Force
          }
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          New-Item -ItemType Directory -Path $packageRoot | Out-Null

          $files = @(
            'CPP\7zip\UI\Console\x64\7z.exe',
            'CPP\7zip\UI\FileManager\x64\7zFM.exe',
            'CPP\7zip\UI\GUI\x64\7zG.exe',
            'CPP\7zip\Bundles\Format7zF\x64\7z.dll',
            'CPP\7zip\Bundles\SFXCon\x64\7zCon.sfx',
            'CPP\7zip\Bundles\SFXSetup\x64\7zS.sfx',
            'CPP\7zip\Bundles\SFXWin\x64\7z.sfx',
            'License.txt',
            'DOC\readme.txt'
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing expected build output: $file"
            }
            Copy-Item -LiteralPath $file -Destination $packageRoot
          }

          Compress-Archive -Path $packageRoot -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-windows-x64-portable
          path: dist/7zip-windows-x64-portable.zip
          if-no-files-found: error
