name: Build Windows x64 Packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64-packages:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build 7-Zip binaries
        shell: cmd
        run: |
          cd CPP\7zip
          nmake PLATFORM=x64

      - name: Build installer tools
        shell: cmd
        run: |
          cd C\Util\7zipInstall
          nmake PLATFORM=x64 Z7_64BIT_INSTALLER=1
          cd ..\7zipUninstall
          nmake PLATFORM=x64 Z7_64BIT_INSTALLER=1

      - name: Prepare portable zip and setup exe
        shell: powershell
        run: |
          $distRoot = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $portableRoot = Join-Path $distRoot '7zip-windows-x64-portable'
          $installerRoot = Join-Path $distRoot '7zip-windows-x64-installer'
          $portableZipPath = Join-Path $distRoot '7zip-windows-x64-portable.zip'
          $installerArchivePath = Join-Path $distRoot '7zip-windows-x64-installer.7z'
          $setupExePath = Join-Path $distRoot '7zip-windows-x64-setup.exe'
          $langRoot = Join-Path $env:GITHUB_WORKSPACE 'Lang'

          foreach ($path in @($portableRoot, $installerRoot)) {
            if (Test-Path $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
          foreach ($path in @($portableZipPath, $installerArchivePath, $setupExePath)) {
            if (Test-Path $path) {
              Remove-Item -LiteralPath $path -Force
            }
          }

          New-Item -ItemType Directory -Path $portableRoot | Out-Null
          New-Item -ItemType Directory -Path $installerRoot | Out-Null

          $files = @(
            @{ Source = 'CPP\7zip\UI\Console\x64\7z.exe'; Destination = '7z.exe' },
            @{ Source = 'CPP\7zip\UI\FileManager\x64\7zFM.exe'; Destination = '7zFM.exe' },
            @{ Source = 'CPP\7zip\UI\GUI\x64\7zG.exe'; Destination = '7zG.exe' },
            @{ Source = 'CPP\7zip\Bundles\Format7zF\x64\7z.dll'; Destination = '7z.dll' },
            @{ Source = 'CPP\7zip\UI\Explorer\x64\7-zip.dll'; Destination = '7-zip.dll' },
            @{ Source = 'CPP\7zip\Bundles\SFXCon\x64\7zCon.sfx'; Destination = '7zCon.sfx' },
            @{ Source = 'CPP\7zip\Bundles\SFXSetup\x64\7zS.sfx'; Destination = '7zS.sfx' },
            @{ Source = 'CPP\7zip\Bundles\SFXWin\x64\7z.sfx'; Destination = '7z.sfx' },
            @{ Source = 'DOC\readme.txt'; Destination = 'readme.txt' }
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file.Source)) {
              throw "Missing expected build output: $($file.Source)"
            }
            Copy-Item -LiteralPath $file.Source -Destination (Join-Path $portableRoot $file.Destination)
            Copy-Item -LiteralPath $file.Source -Destination (Join-Path $installerRoot $file.Destination)
          }

          if (-not (Test-Path $langRoot)) {
            throw "Missing language directory: Lang"
          }
          Copy-Item -LiteralPath $langRoot -Destination (Join-Path $portableRoot 'Lang') -Recurse
          Copy-Item -LiteralPath $langRoot -Destination (Join-Path $installerRoot 'Lang') -Recurse

          $uninstallSource = 'C\Util\7zipUninstall\x64\7zipUninstall.exe'
          if (-not (Test-Path $uninstallSource)) {
            throw "Missing expected build output: $uninstallSource"
          }
          Copy-Item -LiteralPath $uninstallSource -Destination (Join-Path $installerRoot 'Uninstall.exe')

          Compress-Archive -Path $portableRoot -DestinationPath $portableZipPath -CompressionLevel Optimal

          & 'CPP\7zip\UI\Console\x64\7z.exe' a '-t7z' $installerArchivePath (Join-Path $installerRoot '*') '-mx=9' '-m0=lzma' '-mmt=off'
          if ($LASTEXITCODE -ne 0) {
            throw "7z archive creation failed with exit code $LASTEXITCODE"
          }

          $setupStub = Join-Path $env:GITHUB_WORKSPACE 'C\Util\7zipInstall\x64\7zipInstall.exe'
          if (-not (Test-Path $setupStub)) {
            throw "Missing expected build output: C\Util\7zipInstall\x64\7zipInstall.exe"
          }

          $stubBytes = [System.IO.File]::ReadAllBytes($setupStub)
          $archiveBytes = [System.IO.File]::ReadAllBytes($installerArchivePath)
          $output = New-Object byte[] ($stubBytes.Length + $archiveBytes.Length)
          [System.Buffer]::BlockCopy($stubBytes, 0, $output, 0, $stubBytes.Length)
          [System.Buffer]::BlockCopy($archiveBytes, 0, $output, $stubBytes.Length, $archiveBytes.Length)
          [System.IO.File]::WriteAllBytes($setupExePath, $output)

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-windows-x64-packages
          path: |
            dist/7zip-windows-x64-portable.zip
            dist/7zip-windows-x64-setup.exe
          if-no-files-found: error
